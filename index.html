<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intro to JavaScript — Interactive Elements</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Intro to JavaScript</h1>
  <p>Three small interactive demos: a dropdown menu, a modal, and a validated form.</p>

  <section>
    <h2>1. Dropdown Menu</h2>
    <div class="dropdown">
      <button class="dropdown-btn" id="dropdownBtn">Options ▾</button>
      <div class="dropdown-menu" id="dropdownMenu">
        <a href="#">Profile</a>
        <a href="#">Settings</a>
        <a href="#">Log Out</a>
      </div>
    </div>
  </section>

  <section>
    <h2>2. Modal Dialog</h2>
    <button class="btn" id="openModalBtn">Open Modal</button>
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <button class="close-btn" id="closeModalBtn">&times;</button>
        <h3>Hello there!</h3>
        <p>This is a modal built with vanilla JavaScript. Click the &times; or outside the box to close it.</p>
      </div>
    </div>
  </section>

  <section>
    <h2>3. Form Validation</h2>
    <form id="signupForm" novalidate>
      <div>
        <label for="username">Username</label>
        <input type="text" id="username" name="username">
        <div class="error-msg" id="usernameError"></div>
      </div>
      <div>
        <label for="email">Email</label>
        <input type="text" id="email" name="email">
        <div class="error-msg" id="emailError"></div>
      </div>
      <div>
        <label for="password">Password</label>
        <input type="password" id="password" name="password">
        <div class="error-msg" id="passwordError"></div>
      </div>
      <button type="submit" class="dropdown-btn">Sign Up</button>
      <p class="success-msg" id="formSuccess"></p>
    </form>
  </section>
</div>

<script src="script.js"></script>
</body>
</html>
